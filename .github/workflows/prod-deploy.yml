name: Prod Deploy (manual)

# 本番デプロイの手動ボタン。Actions タブ → Prod Deploy (manual) → Run workflow (Branch: main)。
# main 以外を選んだ場合は起動しない(=「prodは必ずmainから」を機械的に強制)。
#
# 必要な Secrets:
#   ENV_PROD                                  .env.production の中身 (VITE_* 一式, groomhaus-prod)
#   FIREBASE_SERVICE_ACCOUNT_GROOMHAUS_PROD   groomhaus-prod のサービスアカウントキー(JSON)

on:
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore .env.production from secret
        run: printf '%s' "$ENV_PROD" > .env.production
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}

      - name: Build (production mode)
        run: npm run build

      # デプロイ前に dist が prod 向けか検査する。ENV_PROD 未登録/空だと
      # 接続先の無い壊れたビルドになるため、本番に出す前にここで止める。
      - name: Preflight - dist points at groomhaus-prod
        run: |
          grep -rl "groomhaus-prod" dist/assets > /dev/null \
            || { echo "::error::dist が groomhaus-prod を向いていません (Secret ENV_PROD が未登録/不正の可能性)"; exit 1; }

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GROOMHAUS_PROD }}
          projectId: groomhaus-prod
          channelId: live

      - name: Verify deployed build matches (check-deploy)
        run: node scripts/check-deploy.mjs prod
